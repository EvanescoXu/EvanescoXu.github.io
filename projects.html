bel="Open: Palm beside a small building"><img src="assets/palm/07.jpeg" alt="Palm beside a small building"></button><button class="wall-photo framed" style="left:59.2157%;top:40.2899%;width:34.2157%;height:39.7101%" data-full="assets/palm/08.jpeg" aria-label="Open: Palm on a red bridge"><img src="assets/palm/08.jpeg" alt="Palm on a red bridge"></button><button class="wall-photo " style="left:9.2157%;top:55.7971%;width:5.6863%;height:10.2899%" data-rotate="90" data-full="assets/palm/09.jpeg" aria-label="Open: Branches reflected in water"><img src="assets/palm/09.jpeg" alt="Branches reflected in water"></button><button class="wall-photo framed" style="left:18.6275%;top:64.9275%;width:12.9412%;height:14.7826%" data-full="assets/palm/10.jpeg" aria-label="Open: Palm reflected in a puddle"><img src="assets/palm/10.jpeg" alt="Palm reflected in a puddle"></button><button class="wall-photo " style="left:33.3333%;top:83.7681%;width:7.0588%;height:8.4058%" data-full="assets/palm/11.jpeg" aria-label="Open: Palm illuminated at night"><img src="assets/palm/11.jpeg" alt="Palm illuminated at night"></button><button class="wall-photo" style="left:12.94%;top:34.35%;width:7.65%;height:13.77%" data-full="assets/palm/12.jpeg" aria-label="Open: Palm on paving"><img src="assets/palm/12.jpeg" alt="Palm on paving"></button><button class="wall-statement" aria-label="Read artist statement" lang="ja"><h2>「ロベレニーを連れて」</h2><p>大和田ゼミ　XU CANLIN</p><p>日本では、ヤシの木は昔から人々の「南国リゾート」へのロマンチックな憧れを乗せてきました。海岸沿いに高くそびえるワシントンヤシから、街角にある太くて丸いカナリーヤシ、そして目立たないけれどあちこちに根を張るシュロまで、それらはとっくに日本で新しい異国の風景を作り出しています。</p><p>しかし私が持っているのは、インドシナ半島原産のロベレニーの鉢植えです。それは小さくて優雅な姿をしており、みんなに愛される「鉢の中の」南国風景となりました。それは完全に人間に飼いならされ、小さくされた自然の景色なのです。</p><p>私はこのロベレニーを連れて、海辺や道路、街角を一緒に旅しました。わずかな土の中に閉じ込められたこの植物に、広い世界と向き合い、すでにこの異国の地に溶け込んでいる巨大な仲間たちを見つめさせたいと思ったからです。これは植物たちの間の、音のない対話です。</p><p>植木鉢は、結局のところこの植物の運命です。根を伸ばす場所がないため、ゆっくりと死に向かうしかありません。葉は元に戻ることなく少しずつ枯れていき、最後には命が尽きてしまいます。すべての緑色が消え去るその日、この小さな体の中で、記憶にある海辺で自由に輝いている仲間たちのことを、ふと思い出すのでしょうか。</p></button></div
